name: Publication guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-runtime-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify guard with fictional Git objects
        run: python -m unittest discover -s tests -p test_publication_privacy.py

      - name: Reject private metadata and content across published ancestry
        env:
          AUDIT_REF: ${{ github.ref }}
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: python scripts/check_commit_privacy.py check "$AUDIT_REF" --branch "$TARGET_BRANCH"
